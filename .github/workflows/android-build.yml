name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pwa/package-lock.json

      - name: Install PWA Dependencies & Build Web Assets
        run: |
          cd pwa
          npm ci
          npm run build

      - name: Add Capacitor Android Platform (if missing)
        run: |
          cd pwa
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd pwa/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolIQ-Driver-APK
          path: pwa/android/app/build/outputs/apk/debug/app-debug.apk
