name: Deploy School App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: nessi
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "=== [1/6] Pulling Latest Changes ==="
            cd ~/school
            git fetch origin
            git reset --hard origin/main

            echo "=== [2/6] Installing Backend Dependencies & Running Migrations ==="
            cd ~/school/backend
            npm ci
            npm run db:migrate

            echo "=== [3/6] Restarting Backend Service via PM2 ==="
            pm2 restart school-backend || pm2 start server.js --name school-backend
            pm2 save

            echo "=== [4/6] Verifying Backend Health ==="
            HEALTH_URL="http://127.0.0.1:3002/health"
            HEALTHY=0
            for i in $(seq 1 6); do
              echo "Checking backend health (attempt $i/6)..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Backend is healthy (HTTP 200)!"
                HEALTHY=1
                break
              fi
              echo "Health check returned HTTP $HTTP_CODE, retrying in 3s..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "::error::Backend health check failed! Dumping last 50 lines of PM2 logs:"
              pm2 logs school-backend --lines 50 --nostream
              exit 1
            fi

            echo "=== [5/6] Building Admin Panel ==="
            cd ~/school/adminpanel
            npm ci
            npm run build

            echo "=== [6/6] Building PWA ==="
            cd ~/school/pwa
            npm ci
            npm run build

            echo "=== Deployment Finished Successfully! ==="
